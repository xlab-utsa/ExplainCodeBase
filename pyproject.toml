[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explaincodebase"
version = "2.0.0"
description = "Hierarchical, call-graph-aware summarization of codebases in any programming language, powered by open models served with vLLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.22",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
explaincodebase = "explaincodebase.cli:main"

[tool.setuptools.packages.find]
include = ["explaincodebase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
